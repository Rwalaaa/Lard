name: Build Windows VST3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # nécessaire pour publier une release sur un tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurer (Visual Studio installé sur la machine, x64)
        run: cmake -S . -B build -A x64

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Tests des moteurs audio (Lard, Koquille, MAKAR)
        env:
          LARD_RENDER: build/Release/lard_render.exe
          LARD_CPU_LIMIT: '15'   # machines partagées : mesure CPU indicative
          KOQ_RENDER: build/Release/render_koquille.exe
          KOQ_CPU_LIMIT: '15'
          MAKAR_RENDER: build/Release/render_makar.exe
          MAKAR_CPU_LIMIT: '15'
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --quiet numpy scipy
          python tools/test_engine.py
          python tools/test_koquille.py
          python tools/test_makar.py

      - name: Validation pluginval (sévérité 10, les trois plugins)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          foreach ($p in @("Lard", "Koquille", "MAKAR")) {
            ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs "build/$($p)_artefacts/Release/VST3/$p.vst3"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Préparer le paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/Lard_artefacts/Release/VST3/Lard.vst3" dist/
          Copy-Item -Recurse "build/Koquille_artefacts/Release/VST3/Koquille.vst3" dist/
          Copy-Item -Recurse "build/MAKAR_artefacts/Release/VST3/MAKAR.vst3" dist/
          Copy-Item README.md dist/LISEZ-MOI.md
          Compress-Archive -Path dist/* -DestinationPath Rwalaaa-Plugins-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Rwalaaa-Plugins-Windows-VST3
          path: dist/

      - name: Lire la version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(Lard VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # release : sur un tag v*, ou sur un commit de main dont le message contient [release]
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Lard, Koquille & MAKAR v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Rwalaaa-Plugins-Windows-VST3.zip
          body: |
            Trois plugins VST3 pour Windows 64 bits :
            - **Lard** : densification agressive (compression + saturation) pour kicks, basses, synthés.
            - **Koquille** : saturateur à lampes (pentode, triode, saturation parallèle par bande) pour bus et mix.
            - **MAKAR** (nouveau) : saturateur de piste à 5 circuits (Bande, Transfo, Germanium, Triode, Pentode), Punish, filtres avant/après.

            Correctif : Lard et Koquille s'ouvraient à 75 % de leur taille à la première ouverture ; ils s'ouvrent maintenant à 100 %.

            **Installation**
            1. Télécharger `Rwalaaa-Plugins-Windows-VST3.zip` ci-dessous et le décompresser.
            2. Copier les dossiers `Lard.vst3`, `Koquille.vst3` et `MAKAR.vst3` dans `C:\Program Files\Common Files\VST3\`.
            3. Dans Ableton : Préférences → Plug-ins → activer « Utiliser les dossiers système VST3 » puis Réanalyser.

            Les trois plugins apparaissent dans Plug-ins → Rwalaaa. Le mode d'emploi est dans `LISEZ-MOI.md`, dans le zip.
