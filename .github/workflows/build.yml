name: Build Windows VST3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # nécessaire pour publier une release sur un tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurer (Visual Studio installé sur la machine, x64)
        run: cmake -S . -B build -A x64

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Tests du moteur audio
        env:
          LARD_RENDER: build/Release/lard_render.exe
          LARD_CPU_LIMIT: '15'   # machines partagées : mesure CPU indicative
        run: |
          python -m pip install --quiet numpy
          python tools/test_engine.py

      - name: Validation pluginval (sévérité 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs "build/Lard_artefacts/Release/VST3/Lard.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Préparer le paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/Lard_artefacts/Release/VST3/Lard.vst3" dist/
          Copy-Item README.md dist/LISEZ-MOI.md
          Compress-Archive -Path dist/* -DestinationPath Lard-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lard-Windows-VST3
          path: dist/

      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lard-Windows-VST3.zip
